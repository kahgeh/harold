[package]
name = "harold"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
config = "0.15.19"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.21.0", features = ["v4", "serde"] }
thiserror = "2.0.18"
time = { version = ">=0.3.47", features = ["serde", "local-offset"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
tonic = "0.14.5"
tonic-prost = "0.14.5"
prost = "0.14.3"
tokio = { version = "1.49.0", features = ["full"] }
tokio-stream = { version = "=0.1.18", default-features = false }
notify = "8.2"
reqwest = { version = "0.12.28", features = ["blocking", "json", "multipart"] }
harold-api = { path = "../harold-api" }
turso.workspace = true
buckwal = { git = "https://github.com/kahgeh/buckwal.git", rev = "b17a4241c79f5c546f1fbc77c20719a063fb8161" }
pulldown-cmark = { version = "=0.13.1", default-features = false }
opendata_log = { package = "opendata-log", version = "=1.0.0" }
opendata_common = { package = "opendata-common", version = "=0.1.17" }
sha2 = "0.10"
hex = "0.4"
opentelemetry = "=0.31.0"
opentelemetry_sdk = { version = "=0.31.0", default-features = false, features = ["trace", "logs", "metrics"] }
opentelemetry-otlp = { version = "=0.31.1", default-features = false, features = ["grpc-tonic", "trace", "logs", "metrics"] }
tracing-opentelemetry = { version = "=0.32.1", default-features = false }
opentelemetry-appender-tracing = "=0.31.1"
axum = { version = "0.8.8", default-features = false, features = ["http1", "tokio"] }
web-push = { version = "=0.11.0", default-features = false }
jwt-simple = { version = "=0.12.16", default-features = false, features = ["pure-rust"] }
askama = { version = "=0.14.0", default-features = false, features = ["derive", "std"] }
datastar = { version = "=0.3.1", default-features = false, features = ["axum"] }
openssl = { version = "=0.10.75", features = ["vendored"] }

[dev-dependencies]
tokio = { version = "1.49.0", features = ["test-util"] }
opentelemetry_sdk = { version = "=0.31.0", default-features = false, features = ["trace", "logs", "metrics", "testing"] }
