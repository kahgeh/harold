<div id="m-{{ event_id }}" class="message {{ sender }}"><p class="text">{% for part in parts %}{% if part.link %}<a href="{{ part.text }}" target="_blank" rel="noopener noreferrer">{{ part.text }}</a>{% else %}{{ part.text }}{% endif %}{% endfor %}</p><p class="who">{% if let Some(mark) = mark %}{% if *mark == Mark::Typed %}<svg class="mark" role="img" aria-label="typed into the chief" viewBox="0 0 22 12" width="22" height="12"><path d="M1 6.5l3.5 3.5L11 2M9 8.5l1.5 1.5L17 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>{% else %}<svg class="mark" role="img" aria-label="stored by Harold" viewBox="0 0 14 12" width="14" height="12"><path d="M1 6.5l3.5 3.5L11 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>{% endif %} me{% if let Some(words) = words %} · {{ words }}{% endif %}{% else %}chief{% endif %}</p></div>
