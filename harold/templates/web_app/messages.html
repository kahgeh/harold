<section id="messages" data-init="@get('/updates', {retry: 'error', retryMaxCount: 1000})" data-on:harold-reopen="@get('/updates', {retry: 'error', retryMaxCount: 1000})">
{% if older %}<p id="older" class="older" data-on-intersect="@get('/thread/older')">Loading earlier messages…</p>
{% endif %}{% for message in messages %}{{ message|safe }}
{% endfor %}</section>
