<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{% if web_app %}<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{ app_name }}">
{% endif %}<title>Specs</title>
<link rel="stylesheet" href="/static/app.css">
{% if web_app %}<script src="/static/back-swipe.js" defer></script>
{% endif %}</head>
<body class="notes">
<header class="bar top">
<div class="row">
<a href="/specs" id="to-specs" class="back-button"{% if web_app %} data-back="/specs"{% endif %}><svg viewBox="0 0 12 20" width="12" height="20" aria-hidden="true"><path d="M10 2L2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="back-label">Specs</span></a>
{% if web_app %}<a href="/" id="to-chat" class="harold-button">Harold</a>
{% endif %}</div>
</header>
<main class="notes-page">
<p class="notes-message">{{ message }}</p>
</main>
</body>
</html>
