<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{ app_name }}">
<meta name="harold-vapid-key" content="{{ public_key }}">
<title>{{ app_name }}</title>
<link rel="manifest" href="/static/manifest.webmanifest">
{% if has_icon %}<link rel="apple-touch-icon" href="/static/icon.png">
{% endif %}
<link rel="stylesheet" href="/static/app.css">
<script type="module" src="/static/datastar-1.0.2.js"></script>
<script src="/static/alerts.js" defer></script>
<script src="/static/call.js" defer></script>
</head>
<body>
<header class="bar top">
<h1>{{ app_name }}</h1>
<button type="button" id="alerts">Turn on alerts</button>
{% if call_set_up %}<button type="button" id="call-start">📞 Call</button>{% else %}<button type="button" id="call-start" disabled>Voice is not set up on the Mac</button>{% endif %}
</header>
<p id="call-notice" class="call-notice" role="status" hidden></p>
<main>
{% include "web_app/messages.html" %}
</main>
<form id="reply" class="bar bottom" data-indicator:sending data-on:submit="@post('/replies')">
<input type="text" data-bind:reply maxlength="1000" placeholder="Reply to the chief" aria-label="Reply to the chief" autocomplete="off">
<button type="submit" data-attr:disabled="$sending">Send</button>
</form>
<div id="call-screen" class="call-screen">
<p id="call-timer" class="call-timer">Call with the chief · 0:00</p>
{{ call|safe }}
</div>
</body>
</html>
