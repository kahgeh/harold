<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{ app_name }}">
<title>{{ title }}</title>
<link rel="manifest" href="/static/manifest.webmanifest">
{% if has_icon %}<link rel="apple-touch-icon" href="/static/icon.png">
{% endif %}<link rel="stylesheet" href="/static/app.css">
</head>
<body class="notes">
<header class="bar top">
<div class="row">
<a href="/notes" id="to-notes" class="back-button"><svg viewBox="0 0 12 20" width="12" height="20" aria-hidden="true"><path d="M10 2L2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Notes</a>
</div>
</header>
<main class="notes-page vault-note">
<p class="note-kind">{{ kind }}</p>
<h3>{{ title }}</h3>
<div class="note-text">{{ html|safe }}</div>
</main>
</body>
</html>
