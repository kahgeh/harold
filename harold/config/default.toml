[grpc]
host = "127.0.0.1"
port = 50060

[imessage]
# recipient and handle_id can also be set via:
#   HAROLD__IMESSAGE__RECIPIENT="+61..."
#   HAROLD__IMESSAGE__HANDLE_ID=36

[telemetry]
# The local collector. Set `export = false` in local.toml to turn export off.
otlp_endpoint = "http://localhost:4317"
# Where Harold forwards the web app's browser spans, as OTLP JSON.
otlp_http_endpoint = "http://localhost:4318"

[chat_db]
path = "~/Library/Messages/chat.db"

[ai]

[activity_summary]
enabled = false
cli_path = "claude"
model = "sonnet"
effort = "low"
timeout_ms = 15000
max_concurrent = 2
max_pending = 64
max_instruction_chars = 4000
max_reply_chars = 8000
max_output_bytes = 65536

[watch]
model = "haiku"
# No budget is shipped. Each of these is optional, and enforced only when set:
# daily_budget_usd = 1.00
# run_budget_usd = 0.05
# max_run_budget_usd = 0.10
# Optional. Folders a watch skill's real path may lie in, besides the watch's own
# .claude/skills/ (absolute paths; a skill is linked into .claude/skills/ from one of them):
# skill_folders = ["/Users/you/code/chief-of-pods/skills/watches", "/Users/you/code/your-organisation/skills/watches"]

# The knowledge tool indexes the organisation's vault of Markdown notes by meaning. It is
# off until `vault` is set. Put these in config/local.toml:
#   vault = "/Users/you/code/your-organisation/vault/knowledge"
#   command = "/path/to/venv/bin/python"          # the Python with llama-cpp-python installed
#   model = "/path/to/embeddinggemma-300M-Q8_0.gguf"
#   [knowledge.bucket]
#   endpoint = "http://127.0.0.1:9000"
#   bucket = "harold-knowledge"
#   credentials_file = "/Users/you/.config/harold/knowledge-bucket"   # mode 0600
#   encryption_key_file = "/Users/you/.config/harold/knowledge-key"   # mode 0600
[knowledge]
# Vault note files, relative to the vault, that are not indexed. This organisation's index
# and change log would be exclude = ["MEMORY.md", "log.md"].
exclude = []

# The knowledge graph keeps typed links between vault notes in TypeDB, rebuilt from two
# OpenData logs. It is off until you set these in config/local.toml, and it needs
# [knowledge] vault. You install the TypeDB server; Harold starts it on 127.0.0.1 on the
# first graph call and stops it after idle_minutes without one.
#   [knowledge.graph]
#   enabled = true
#   server = "/opt/homebrew/bin/typedb_server_bin"
[knowledge.graph]
enabled = false
idle_minutes = 10

# The small model that answers each turn of a call; real work goes to the chief. It runs
# Claude Code with [activity_summary] cli_path, whether or not activity summaries are on.
[call_answerer]
enabled = true
model = "haiku"
timeout_seconds = 15
run_budget_usd = 0.02 # --max-budget-usd for each run

# Reminds the chief, once per session, to hand off and restart. It is typed into the chief's
# pane at the end of a turn when its Claude Code session is older than after_hours or has
# compacted after_compactions times. See docs/references/timed-prompts/README.md.
[restart_reminder]
enabled = true
after_hours = 24
after_compactions = 2

[agent_monitor]
inventory_interval_ms = 2000
inventory_timeout_ms = 3000
screen_interval_ms = 2000
hook_grace_ms = 2000
report_grace_ms = 30000

[[agents]]
id = "codex"
screen_adapter = "codex-v1"
screen_history_lines = 2000
display_name = "Codex"
command_contains = ["codex"]
busy_all = ["Working", "esc to interrupt"]
idle_all = ["Ask Codex to do anything"]
summary_line_prefixes = ["›"]

[[agents]]
id = "claude"
screen_adapter = "claude-v1"
display_name = "Claude"
command_contains = ["claude"]
busy_all = ["esc to interrupt"]
idle_all = ["❯"]
summary_line_prefixes = ["❯"]

[[agents]]
id = "opencode"
display_name = "OpenCode"
command_contains = ["opencode"]
busy_all = ["esc interrupt"]
idle_all = ["agents", "commands"]
# OpenCode 1.4.10 renders prompt and user-message rows with the same visible
# prefix, so no safe provider-specific fallback summary prefix is configured.

[tts]
command = "say"
# The commit of the Kokoro model (mlx-community/Kokoro-82M-bf16) that Harold downloads, checks
# and loads when [voice_input] is set. 40 lowercase hex characters.
model_revision = "a71e4d38b236d968966a2002c4c895dbd12b1c3c"
# voice can be overridden in local.toml, e.g. voice = "Samantha"
# fallback_command can be set in local.toml to run a backup TTS command
# if the primary command fails.

# [voice_input] is set in local.toml. Its settings besides `command` and `args`, and their
# defaults:
#   keep_worker_minutes = 10
#   language = "en"  # the Whisper language code every call turn is transcribed in
#   model_revision = "a4aaeec0636e6fef84abdcbe3544cb2bf7e9f6fb"  # mlx-community/whisper-large-v3-turbo

[log]
level = "info"

[store]
path = "~/.harold/store"

[notify]
skip_if_session_active = true
skip_if_pane_active = false
# Which pane is the chief, matched by folder. Each list says whose agents may use that
# channel: [] is nobody, ["*"] is everyone.
chief = "chief-of-pods"
imessage = ["chief-of-pods"]
web_app = ["chief-of-pods"]
machine_audio_output = ["chief-of-pods"]

# Timed prompts: none by default. Add [[timed_prompts]] entries in local.toml.
# See docs/references/timed-prompts/README.md.

# The web app ([web_app] in local.toml) admits only paired devices. The pairing code is a line
# HAROLD_PAIRING_CODE=<code> in ~/bin/harold/config/pairing.env (mode 0600), or in the file
# [web_app] pairing_file names. [web_app] require_pairing = false switches the check off.
