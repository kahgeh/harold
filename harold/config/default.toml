[grpc]
host = "127.0.0.1"
port = 50060

[imessage]
# recipient and handle_id can also be set via:
#   HAROLD__IMESSAGE__RECIPIENT="+61..."
#   HAROLD__IMESSAGE__HANDLE_ID=36

[chat_db]
path = "~/Library/Messages/chat.db"

[ai]

[agent_monitor]
inventory_interval_ms = 1000
screen_interval_ms = 500
hook_grace_ms = 2000

[[agents]]
id = "codex"
display_name = "Codex"
command_contains = ["codex"]
busy_all = ["Working", "esc to interrupt"]
idle_all = ["Ask Codex to do anything"]
summary_line_prefixes = ["›"]

[[agents]]
id = "claude"
display_name = "Claude"
command_contains = ["claude"]

[[agents]]
id = "opencode"
display_name = "OpenCode"
command_contains = ["opencode"]

[tts]
command = "say"
# voice can be overridden in local.toml, e.g. voice = "Samantha"
# fallback_command can be set in local.toml to run a backup TTS command
# if the primary command fails.

[log]
level = "info"

[store]
path = "~/.harold/events"

[telegram]
# bot_token and chat_id set in local.toml or env vars:
#   HAROLD__TELEGRAM__BOT_TOKEN="123:ABC..."
#   HAROLD__TELEGRAM__CHAT_ID=12345678

[notify]
skip_if_session_active = true
skip_if_pane_active = false
away_channel = "imessage"
