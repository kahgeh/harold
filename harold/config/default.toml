[grpc]
host = "127.0.0.1"
port = 50060

[imessage]
# recipient and handle_id can also be set via:
#   HAROLD__IMESSAGE__RECIPIENT="+61..."
#   HAROLD__IMESSAGE__HANDLE_ID=36

[telemetry]
# The local collector. Set `export = false` in local.toml to turn export off.
otlp_endpoint = "http://localhost:4317"

[chat_db]
path = "~/Library/Messages/chat.db"

[ai]

[activity_summary]
enabled = false
cli_path = "claude"
model = "sonnet"
effort = "low"
timeout_ms = 15000
max_concurrent = 2
max_pending = 64
max_instruction_chars = 4000
max_reply_chars = 8000
max_output_bytes = 65536

[watch]
model = "haiku"
# No budget is shipped. Each of these is optional, and enforced only when set:
# daily_budget_usd = 1.00
# run_budget_usd = 0.05
# max_run_budget_usd = 0.10

[agent_monitor]
inventory_interval_ms = 2000
inventory_timeout_ms = 3000
screen_interval_ms = 2000
hook_grace_ms = 2000
report_grace_ms = 30000

[[agents]]
id = "codex"
screen_adapter = "codex-v1"
screen_history_lines = 2000
display_name = "Codex"
command_contains = ["codex"]
busy_all = ["Working", "esc to interrupt"]
idle_all = ["Ask Codex to do anything"]
summary_line_prefixes = ["›"]

[[agents]]
id = "claude"
screen_adapter = "claude-v1"
display_name = "Claude"
command_contains = ["claude"]
busy_all = ["esc to interrupt"]
idle_all = ["❯"]
summary_line_prefixes = ["❯"]

[[agents]]
id = "opencode"
display_name = "OpenCode"
command_contains = ["opencode"]
busy_all = ["esc interrupt"]
idle_all = ["agents", "commands"]
# OpenCode 1.4.10 renders prompt and user-message rows with the same visible
# prefix, so no safe provider-specific fallback summary prefix is configured.

[tts]
command = "say"
# voice can be overridden in local.toml, e.g. voice = "Samantha"
# fallback_command can be set in local.toml to run a backup TTS command
# if the primary command fails.

[log]
level = "info"

[store]
path = "~/.harold/store"

[telegram]
# bot_token and chat_id set in local.toml or env vars:
#   HAROLD__TELEGRAM__BOT_TOKEN="123:ABC..."
#   HAROLD__TELEGRAM__CHAT_ID=12345678

[notify]
skip_if_session_active = true
skip_if_pane_active = false
away_channel = "imessage"
# Which pane is the chief, matched by folder. Each list says whose agents may use that
# channel: [] is nobody, ["*"] is everyone.
chief = "chief-of-pods"
imessage = ["chief-of-pods"]
telegram = ["chief-of-pods"]
web_app = ["chief-of-pods"]
machine_audio_output = ["chief-of-pods"]

# Timed prompts: none by default. Add [[timed_prompts]] entries in local.toml.
# See docs/references/timed-prompts/README.md.
