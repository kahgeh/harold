# This Mac's name in every message Harold sends and in reply tags. Defaults to the
# output of `hostname -s`. No whitespace, '/', ':', '[' or ']'.
# machine_name = "studio"

# Several Macs: the machine names of all your Macs, the same list on every Mac.
# Setting it turns multi-Mac reply routing on. It must include this Mac's name.
# machines = ["studio", "laptop"]

[imessage]
recipient = "+61..."
# All chat.db handle IDs for your Apple ID (phone number, emails).
# Run: sqlite3 ~/Library/Messages/chat.db "SELECT ROWID, id FROM handle;"
handle_ids = [1, 36]

[ai]
cli_path = "/path/to/claude"
# Optional: local MLX model for short TTS summaries (faster, private)
# local_model = "Qwen/Qwen3-32B-MLX-8bit"
# local_model_dir = "/path/to/mlx-lm"

# Dashboard descriptions use Claude authentication independently of [ai].
[activity_summary]
enabled = true
cli_path = "/path/to/claude"
model = "sonnet"
effort = "low"

# Watches (harold tool watch): the model every watch runs. The budgets below are yours
# to keep; each one is enforced only when it is set, and none is set by default.
# [watch]
# model = "haiku"
# daily_budget_usd = 1.00       # every watch together, per local day
# run_budget_usd = 0.05         # a run's limit when start gives no --run-budget
# max_run_budget_usd = 0.10     # the most --run-budget may ask
# Folders a watch skill's real path may lie in, besides the watch's own .claude/skills/.
# Absolute paths only (~/ is not expanded). The organisation repositories' watch skills:
# skill_folders = ["/Users/you/code/chief-of-pods/skills/watches", "/Users/you/code/your-organisation/skills/watches"]

# Override the named provider list only when custom process or visible-screen
# markers are required. Overrides replace the complete [[agents]] list.
# [[agents]]
# id = "custom-agent"
# display_name = "Custom Agent"
# command_contains = ["custom-agent"]
# busy_all = ["Working"]
# idle_all = ["Ready"]
# summary_line_prefixes = [">"]
# screen_adapter = "generic-v1" # use codex-v1 for Codex, claude-v1 for Claude Code
# screen_history_lines = 2000 # positive, at most 10000 history rows

[store]
path = "~/bin/harold/data/store"

[tts]
command = "say"
# voice = "Samantha"
# Optional fallback if the primary TTS command fails:
# fallback_command = "say"
# fallback_voice = "Samantha"
# Or use a custom TTS executable. Harold appends the message as the final arg.
# command = "/path/to/python"
# args = ["-m", "mlx_audio.tts.generate", "--voice", "af_heart", "--play", "--text"]

# Calls with the chief at the desk (tmx-agent-dash: c). Off when absent. The worker loads the Whisper model named by --model, with command as its Python.
# [voice_input]
# command = "/Users/you/Dev/xn/mlx-audio/.venv/bin/python"
# args = ["-m", "mlx_audio.stt.generate", "--model", "mlx-community/whisper-large-v3-turbo"]

# [notify]
# skip_if_session_active = true  # skip if completing pane is in the active tmux session
# skip_if_pane_active = false    # skip if completing pane is the active pane and screen is unlocked
# chief = "/Users/you/Dev/chief-of-pods"                 # which pane is the chief, matched by folder
# imessage = ["/Users/you/Dev/chief-of-pods"]            # whose agents may reach the phone by iMessage; [] is nobody, ["*"] is everyone
# web_app = ["/Users/you/Dev/chief-of-pods"]             # the same for the web app
# machine_audio_output = ["/Users/you/Dev/chief-of-pods"]  # whose agents may be spoken aloud on the Mac; [] is nobody, ["*"] is everyone

# Telemetry: export to the local collector is on by default (default.toml sets otlp_endpoint). Set export = false to turn it off. Leave alert_listen and pod_registry out to turn those off. Set pod_registry on one Mac only, or merges are counted twice.
# [telemetry]
# export = false                                                   # export off: Harold sends nothing to the collector and logs no warning
# otlp_endpoint = "http://localhost:4317"                          # the OpenTelemetry collector's gRPC address, http:// only (no TLS); Harold sends its traces, logs and metrics here
# alert_listen = "127.0.0.1:4320"                                  # the address and port Harold takes alerts on
# pod_registry = "/Users/you/code/<your-vault>/products.toml"    # the organisation's products.toml, in its vault, read every minute for pod facts

# A text Harold types into an agent's pane at a set local time each day, only when the
# agent is idle and its input box is empty. Claude Code agents only. One block for each.
# [[timed_prompts]]
# name = "digest"                              # letters, digits, "-" and "_"; names the prompt in the log
# at = "07:50"                                 # local time, 24-hour HH:MM
# folder = "/Users/you/Dev/chief-of-pods"      # the agent running in this folder gets the text
# text = "digest"                              # typed exactly, then Enter
# give_up_after_minutes = 120                  # how long after `at` Harold keeps trying; 1 to 1439

# Two Macs need only `machines` and the same Apple ID.

# The home-screen app, served to the phone through `tailscale serve`. Absent: off.
# [web_app]
# listen = "127.0.0.1:4330"        # loopback only
# allowed_login = "you@example.com" # your Tailscale login
# app_name = "Chief M4"            # this Mac's name under the icon, 1 to 30 characters; default "Chief"
# icon = "~/code/your-organisation/machines/<this Mac>/icon.png" # a square PNG, 180 to 1024 pixels a side, at most 1 MB; read at start
