[package]
name = "control-tower"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
terminal-fault-harness = []
# Timing tests that need a quiet machine are ignored unless this feature is on.
timing-tests = []

[dependencies]
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["events"] }
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { version = "=0.14.5", default-features = false, features = ["channel", "codegen"] }
chrono = { version = "=0.4.44", default-features = false, features = ["clock"] }
harold-api = { path = "../harold-api" }

[[example]]
name = "terminal_fault_harness"
required-features = ["terminal-fault-harness"]
