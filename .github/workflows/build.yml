name: Build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    concurrency:
      group: build-${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: false
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build prerequisites
        run: |
          test "$(uname -m)" = arm64
          brew install protobuf tmux
          tmux -V
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add aarch64-apple-darwin

      - name: Check no local paths are tracked
        run: ./scripts/check_local_paths.sh

      - name: Test
        run: |
          cargo test --locked --workspace --target aarch64-apple-darwin
          cargo test --locked -p harold --target aarch64-apple-darwin live_tmux_inventory_roundtrip_without_locale -- --ignored
          python3 -m unittest discover -s scripts/tests
          python3 -m unittest hooks.shared.harold_turn_complete_test
          python3 -m unittest hooks.providers.test_turn_complete

      - name: Check the feature mixes
        env:
          CARGO_BUILD_TARGET: aarch64-apple-darwin
        run: ./scripts/check_features.sh

      - name: Build release binaries
        env:
          HAROLD_RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: cargo build --locked --release --target aarch64-apple-darwin -p harold -p control-tower

      - name: Check no OpenSSL library is linked
        run: |
          libs=$(otool -L target/aarch64-apple-darwin/release/harold)
          if grep -E 'libssl|libcrypto' <<<"$libs"; then
            echo "harold links an OpenSSL library; vendored OpenSSL is required" >&2
            exit 1
          fi

      - name: Package and smoke test
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          package="harold-aarch64-apple-darwin"
          mkdir -p "dist/$package/config" "dist/$package/scripts" "dist/$package/hooks" "dist/$package/skills/send-message-to-away-device"
          for binary in harold control-tower; do
            source="target/aarch64-apple-darwin/release/$binary"
            lipo "$source" -verify_arch arm64
            cp "$source" "dist/$package/$binary"
            codesign --force --sign - "dist/$package/$binary"
            codesign --verify --strict "dist/$package/$binary"
          done
          "dist/$package/harold" --help
          cp harold-api/proto/harold.proto "dist/$package/"
          cp harold/config/default.toml harold/config/local.template.toml "dist/$package/config/"
          cp scripts/install.py scripts/harold_service.py "dist/$package/scripts/"
          cp hooks/shared/harold_turn_complete.py "dist/$package/hooks/"
          cp hooks/providers/claude_turn_complete.py hooks/providers/codex_turn_complete.py "dist/$package/hooks/"
          cp -R hooks/claude-mod "dist/$package/hooks/claude-mod"
          find "dist/$package/hooks/claude-mod" -name '*.test.ts' -delete
          for file in .claude-plugin/plugin.json hooks/hooks.json hooks/register.ts hooks/accept.ts; do
            test -f "dist/$package/hooks/claude-mod/$file"
          done
          cp skills/send-message-to-away-device/SKILL.md "dist/$package/skills/send-message-to-away-device/"
          test -f "dist/$package/skills/send-message-to-away-device/SKILL.md"
          cp README.md LICENSE "dist/$package/"
          cp -R LICENSES "dist/$package/LICENSES"
          printf '%s\n' "$GITHUB_SHA" > "dist/$package/REVISION"
          printf '%s\n' "$RELEASE_TAG" > "dist/$package/VERSION"
          tar -czf "dist/$package.tar.gz" -C dist "$package"
          cd dist
          shasum -a 256 "$package.tar.gz" > "$package.tar.gz.sha256"
          shasum -a 256 -c "$package.tar.gz.sha256"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/harold-aarch64-apple-darwin.tar.gz \
            dist/harold-aarch64-apple-darwin.tar.gz.sha256 \
            --clobber

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    concurrency:
      group: build-${{ github.workflow }}-${{ github.ref }}-linux
      cancel-in-progress: false
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler build-essential perl
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Check no local paths are tracked
        run: ./scripts/check_local_paths.sh

      - name: Check the macOS guard stops a build with the defaults
        shell: bash
        run: |
          set -uo pipefail
          if cargo check --locked -p harold >guard.log 2>&1; then
            echo "the default features built on Linux; the guard must stop them" >&2
            exit 1
          fi
          grep -q "needs macOS" guard.log || { cat guard.log >&2; echo "the build failed, but not with 'needs macOS'" >&2; exit 1; }

      - name: Test
        run: |
          cargo test --locked --workspace --no-default-features --features harold/linux-defaults
          python3 -m unittest discover -s scripts/tests
          python3 -m unittest hooks.shared.harold_turn_complete_test
          python3 -m unittest hooks.providers.test_turn_complete
          python3 -I harold/src/tts/test_tts_workers.py
