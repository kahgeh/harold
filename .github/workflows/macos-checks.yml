name: macOS checks

# Runs on each push to main, beside the Linux tests. The release command publishes only a
# commit whose run of this workflow and of the Linux workflow passed.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    concurrency:
      group: macos-checks-${{ github.sha }}-test
      cancel-in-progress: false
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build prerequisites
        run: |
          test "$(uname -m)" = arm64
          brew install protobuf tmux
          tmux -V
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add aarch64-apple-darwin

      - name: Check no local paths are tracked
        run: ./scripts/check_local_paths.sh

      - name: Restore the compiled dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-1.97.1-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-1.97.1-

      - name: Test
        timeout-minutes: 40
        run: |
          cargo test --locked --workspace --target aarch64-apple-darwin
          cargo test --locked -p harold --target aarch64-apple-darwin live_tmux_inventory_roundtrip_without_locale -- --ignored
          python3 -m unittest discover -s scripts/tests
          python3 -m unittest hooks.shared.harold_turn_complete_test
          python3 -m unittest hooks.providers.test_turn_complete

      - name: Save the compiled dependencies
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-1.97.1-test-${{ hashFiles('Cargo.lock') }}

  features:
    runs-on: macos-15
    timeout-minutes: 45
    concurrency:
      group: macos-checks-${{ github.sha }}-features
      cancel-in-progress: false
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build prerequisites
        run: |
          test "$(uname -m)" = arm64
          brew install protobuf tmux
          tmux -V
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add aarch64-apple-darwin

      - name: Check no local paths are tracked
        run: ./scripts/check_local_paths.sh

      - name: Restore the compiled dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-1.97.1-features-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-1.97.1-

      - name: Check the feature mixes
        timeout-minutes: 30
        env:
          CARGO_BUILD_TARGET: aarch64-apple-darwin
        run: ./scripts/check_features.sh

      - name: Save the compiled dependencies
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-1.97.1-features-${{ hashFiles('Cargo.lock') }}
