// The knowledge tool: Harold's index of the vault by meaning.
//
// A vault note is one Markdown file in the vault; its name is its path without ".md",
// such as "a-knowledge-index-on-buckwal" or "references/hyperdx".
//
// Callers (the chief's CLI, the web app and the dash):
//   Search         the closest vault notes to some words, best passage per note,
//                  closest first. `source` is "chief", "app" or "dash" and goes only
//                  to the search span.
//   Recent         the vault notes changed most recently, newest first.
//   Related        the vault notes closest to a vault note's own passages, the note
//                  itself left out, each marked linked or not linked.
//   SuggestLinks   related notes scoring 0.60 or more that the note does not link to
//                  yet, at most 5.
//   ShowVaultNote  a vault note as stored.
//   Status         what the index holds and how it is doing.
//   Rebuild        clears the index and builds it again from the vault.
//
// The knowledge graph (typed relations between vault notes, in TypeDB):
//   Relate         records a typed relation: from, relation, to.
//   Unrelate       removes one; a relation that is not there is not an error.
//   RelationsOf    a vault note's links and typed relations, both ways.
//   GraphStatus    whether the graph is on and how far it is behind its logs.
//   RebuildGraph   drops the graph database and replays the schema log, then the data log.
//   VoidGraphRecord  voids the one record the catch-up stopped at.
//   Status and Rebuild stay index only.
//
// Refusals:
//   InvalidArgument      message "invalid <field>".
//   NotFound             message "unknown_vault_note".
//   FailedPrecondition   message "not_refused" (VoidGraphRecord for any other sequence).
//   Unavailable          message "search_resting: <reason>" when the embedding worker
//                        could not load, or "store_failed: <reason>" when the database
//                        is not open or could not be read;
//                        the details carry a fixed reason word, never error text.
//                        Graph calls also say "graph_off", "graph_behind", "graph_rebuilding",
//                        "log_failed" or "typedb_unreachable".
//
// The server trusts local callers: there is no token.
syntax = "proto3";

package harold.tools.knowledge.v1;

service KnowledgeService {
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc Recent(RecentRequest) returns (RecentResponse);
  rpc Related(RelatedRequest) returns (RelatedResponse);
  rpc SuggestLinks(SuggestLinksRequest) returns (SuggestLinksResponse);
  rpc ShowVaultNote(ShowVaultNoteRequest) returns (VaultNote);
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc Rebuild(RebuildRequest) returns (RebuildResponse);
  rpc Relate(RelateRequest) returns (RelateResponse);
  rpc Unrelate(RelateRequest) returns (RelateResponse);
  rpc RelationsOf(RelationsOfRequest) returns (RelationsOfResponse);
  rpc GraphStatus(GraphStatusRequest) returns (GraphStatusResponse);
  rpc RebuildGraph(RebuildGraphRequest) returns (RebuildGraphResponse);
  rpc VoidGraphRecord(VoidGraphRecordRequest) returns (VoidGraphRecordResponse);
}

// One vault note in a list.
message Hit {
  string name = 1;
  string title = 2;
  string kind = 3;
  string description = 4;
  // The matching passage cut to about 200 characters; empty for Recent.
  string passage = 5;
  // Closeness plus the word bonus; 0 for Recent.
  double score = 6;
  // Related and SuggestLinks only: whether the asked vault note links to this one.
  bool linked = 7;
  // Unix milliseconds the vault note last changed in the index.
  int64 changed_at_ms = 8;
}

message SearchRequest {
  string query = 1;
  // 0 means 10; at most 10.
  uint32 limit = 2;
  string source = 3;
}
message SearchResponse {
  repeated Hit hits = 1;
}

message RecentRequest {
  uint32 limit = 1;
}
message RecentResponse {
  repeated Hit hits = 1;
}

message RelatedRequest {
  string name = 1;
  uint32 limit = 2;
}
message RelatedResponse {
  repeated Hit hits = 1;
}

message SuggestLinksRequest {
  string name = 1;
}
message SuggestLinksResponse {
  repeated Hit hits = 1;
}

message ShowVaultNoteRequest {
  string name = 1;
}
message VaultNote {
  string name = 1;
  string title = 2;
  string kind = 3;
  string description = 4;
  string created = 5;
  // The [[links]] the note holds, as vault note names as written.
  repeated string links = 6;
  // The note's text as stored, front matter removed.
  string text = 7;
  // The file's path under the vault.
  string path = 8;
  int64 changed_at_ms = 9;
  // The file's absolute path, for opening it in an editor on the Mac.
  string file = 10;
}

message StatusRequest {}
message StatusResponse {
  uint32 vault_notes = 1;
  uint32 passages = 2;
  // Unix milliseconds of the last successful pass; 0 when none has succeeded.
  int64 last_ok_ms = 3;
  // Changed files not yet indexed.
  uint32 pending = 4;
  string runtime = 5;
  string model = 6;
  uint32 dimensions = 7;
  // "idle", "loading", "ready" or "unavailable".
  string worker = 8;
  // When the last pass failed: "vault_unreadable", "worker_failed", "store_failed"
  // or "bucket_unreachable"; empty otherwise.
  string last_failure = 9;
  // True when searches answer from the last index because the vault cannot be read.
  bool vault_unreadable = 10;
}

message RebuildRequest {}
message RebuildResponse {
  uint32 vault_notes = 1;
  uint32 passages = 2;
}

// Relate and Unrelate. `from` and `to` are vault note names; `relation` is one of
// relates_to, supersedes, part_of, inspired_by, contradicts.
message RelateRequest {
  string from = 1;
  string relation = 2;
  string to = 3;
}

message RelateResponse {
  // False when the graph already held the change, so nothing was logged.
  bool changed = 1;
}

message RelationsOfRequest {
  string vault_note = 1;
}

// One link or typed relation of the asked vault note.
message GraphRelation {
  // The vault note on the other side.
  string name = 1;
  string title = 2;
  // "links" for a [[link]] in a vault note's text, else the typed relation's type.
  string relation = 3;
  // True when the asked vault note is the source (from).
  bool outgoing = 4;
  // True when the vault note on the other side has gone from the vault.
  bool missing = 5;
}

message RelationsOfResponse {
  repeated GraphRelation relations = 1;
}

message GraphStatusRequest {}

// The sequences are log sequences, not counts. A `has_` flag is false when the log or the
// position holds no record yet.
message GraphStatusResponse {
  bool enabled = 1;
  bool has_schema_position = 2;
  uint64 schema_position = 3;
  bool has_data_position = 4;
  uint64 data_position = 5;
  bool has_schema_end = 6;
  uint64 schema_end = 7;
  bool has_data_end = 8;
  uint64 data_end = 9;
  // Records with a sequence greater than the position, in both logs.
  uint64 waiting = 10;
  bool has_last_refusal = 11;
  uint64 last_refusal_sequence = 12;
  string last_refusal_reason = 13;
}

message RebuildGraphRequest {}

message RebuildGraphResponse {
  uint64 schema_steps = 1;
  uint64 records = 2;
  uint64 voided = 3;
  uint64 vault_notes = 4;
  uint64 links = 5;
  uint64 typed_relations = 6;
  uint64 ms = 7;
}

message VoidGraphRecordRequest {
  uint64 sequence = 1;
  // One word: letters, digits, "_" and "-".
  string reason = 2;
}

message VoidGraphRecordResponse {
  // The data log sequence of the voided record.
  uint64 void_sequence = 1;
}
