// The question queue: Harold's first tool.
//
// The Question message holds a question or instructions: a question has
// decisions, instructions have a title and numbered steps, never both.
//
// The chief of pods calls:
//   PutQuestion      adds a question or instructions, or replaces one with the
//                    same id (the version rises and it is waiting again).
//   DismissQuestion  withdraws a question or instructions, with a reason the
//                    dash shows.
//   ReorderQuestions puts the listed waiting or deferred ids, of questions and
//                    instructions, first, in order.
//   MarkChecked      records that the chief has just checked every todo against
//                    its spec.
//
// The dash calls:
//   ListQuestions    the waiting and deferred questions and instructions, the
//                    count of questions waiting (instructions are not counted),
//                    recently dismissed ids with their reasons, the time of the
//                    chief's last check, and each todo's spec state.
//   AnswerQuestion   answers a question (picks or a note) or instructions
//                    (DONE or IGNORE) at the version the dash saw.
//   DeferQuestion    sets a question aside; it returns to waiting once a batch is typed and nothing else waits.
//   TickStep         ticks or unticks one step of waiting instructions.
//   SavePicks        replaces the saved picks of a waiting or deferred question
//                    at the version the dash saw.
//
// The chief of pods and the CLI also call:
//   ShowQuestion     a stored question in any state, with its saved picks.
//
// Refusals:
//   InvalidArgument      message "invalid <field>" for a broken rule; nothing
//                        is stored. `invalid spec_file` is a path that is not
//                        absolute, does not end in `.md`, is 1,000 characters
//                        or more, comes with no `sha`, or does not sit inside
//                        the `.superpowers/pod/specs/` folder of a registered
//                        product once symlinks are resolved. `invalid step` is a step number that is 0
//                        or past the last step, or a tick on a question.
//                        `invalid picks` is a pick list that breaks the
//                        revise rule (see SavePicks).
//   NotFound             message "unknown_question" (ShowQuestion of an id
//                        that was never stored).
//   FailedPrecondition   message "version_changed" (the question or instructions
//                        changed since the dash read it) or "not_waiting" (it is no longer
//                        waiting for an answer) or "spec_changed" (AnswerQuestion
//                        and SavePicks: the todo's spec file no longer matches
//                        the checksum it was asked with).
//   Unavailable          the database write failed.
//
// The server trusts local callers: there is no token.
syntax = "proto3";

package harold.tools.questions.v1;

service QuestionService {
  rpc PutQuestion(PutQuestionRequest) returns (PutQuestionResponse);
  rpc DismissQuestion(DismissQuestionRequest) returns (DismissQuestionResponse);
  rpc ReorderQuestions(ReorderQuestionsRequest) returns (ReorderQuestionsResponse);
  rpc ListQuestions(ListQuestionsRequest) returns (ListQuestionsResponse);
  rpc AnswerQuestion(AnswerQuestionRequest) returns (AnswerQuestionResponse);
  rpc DeferQuestion(DeferQuestionRequest) returns (DeferQuestionResponse);
  rpc TickStep(TickStepRequest) returns (TickStepResponse);
  rpc SavePicks(SavePicksRequest) returns (SavePicksResponse);
  rpc ShowQuestion(ShowQuestionRequest) returns (ShowQuestionResponse);
  rpc MarkChecked(MarkCheckedRequest) returns (MarkCheckedResponse);
}

message DecisionOption {
  string key = 1;
  string label = 2;
  string impact = 3;
  bool suggested = 4;
  bool free = 5;
}

message Decision {
  string ask = 1;
  repeated DecisionOption options = 2;
}

message Step {
  string text = 1;
  string detail = 2;
}

message Question {
  string id = 1;
  string product = 2;
  string spec = 3;
  string sha = 4;
  string link = 5;
  string intro = 6;
  repeated Decision decisions = 7;
  // Instructions only: the title and the numbered steps.
  string title = 8;
  repeated Step steps = 9;
  // Optional, put only: the full path of the spec's Markdown file, which the tool
  // opens only inside a registered product's `.superpowers/pod/specs/` folder to
  // compare its checksum with `sha`. Never returned: reads leave it empty.
  string spec_file = 10;
}

message PutQuestionRequest {
  Question question = 1;
}

message PutQuestionResponse {
  string id = 1;
  uint32 version = 2;
}

message DismissQuestionRequest {
  string id = 1;
  string reason = 2;
}

message DismissQuestionResponse {}

message ReorderQuestionsRequest {
  repeated string ids = 1;
}

message ReorderQuestionsResponse {}

message ListQuestionsRequest {}

message ListedQuestion {
  Question question = 1;
  uint32 version = 2;
  bool deferred = 3;
  // Instructions only: the step numbers (from 1) that are ticked.
  repeated uint32 ticked = 4;
  // A question only: the saved picks, one per picked decision.
  repeated Pick picks = 5;
  SpecState spec_state = 6;
}

// Whether the todo's spec file still has the checksum the todo was asked with.
// UNKNOWN: no spec file was named, or it could not be read safely.
enum SpecState {
  SPEC_STATE_UNKNOWN = 0;
  SPEC_STATE_CURRENT = 1;
  SPEC_STATE_CHANGED = 2;
}

message Dismissed {
  string id = 1;
  string reason = 2;
}

message ListQuestionsResponse {
  repeated ListedQuestion questions = 1;
  // The questions waiting; instructions are left out.
  uint32 waiting = 2;
  repeated Dismissed dismissed = 3;
  // When the chief last called MarkChecked, in milliseconds since the Unix epoch;
  // 0 before the first check.
  int64 checked_at_ms = 4;
}

enum AnswerKind {
  ANSWER_KIND_UNSPECIFIED = 0;
  ANSWER_KIND_ANSWER = 1;
  ANSWER_KIND_REVISE = 2;
  ANSWER_KIND_REJECT = 3;
  ANSWER_KIND_FREE_TEXT = 4;
  // Instructions only, with no picks and no note.
  ANSWER_KIND_DONE = 5;
  ANSWER_KIND_IGNORE = 6;
}

// One choice for one decision. `decision` counts from 0; `text` is set only
// when the chosen option is a free one.
message Pick {
  uint32 decision = 1;
  string key = 2;
  string text = 3;
}

message AnswerQuestionRequest {
  string id = 1;
  uint32 version = 2;
  AnswerKind kind = 3;
  repeated Pick picks = 4;
  string note = 5;
  // Asks for the ANSWERS line at once, without the settle wait.
  bool send_now = 6;
  // The W3C traceparent of the request that carried the answer, when it came with one.
  // Empty from the dash and from older callers.
  string trace_parent = 7;
}

message AnswerQuestionResponse {}

message DeferQuestionRequest {
  string id = 1;
}

message DeferQuestionResponse {}

// Ticks (`ticked` true) or unticks one step, counted from 1, of waiting
// instructions at the version the dash saw.
message TickStepRequest {
  string id = 1;
  uint32 version = 2;
  uint32 step = 3;
  bool ticked = 4;
}

message TickStepResponse {}

// Replaces the saved picks of a waiting or deferred question at the version the
// dash saw. The picks follow the revise rule: any picks so far, in decision
// order, keys valid, a free pick with `text`. An empty list clears them.
message SavePicksRequest {
  string id = 1;
  uint32 version = 2;
  repeated Pick picks = 3;
}

message SavePicksResponse {}

message ShowQuestionRequest {
  string id = 1;
}

// `state` is waiting, deferred, answered, sent or dismissed; `reason` is the
// dismissal reason, empty otherwise.
message ShowQuestionResponse {
  Question question = 1;
  uint32 version = 2;
  string state = 3;
  string reason = 4;
  repeated Pick picks = 5;
  SpecState spec_state = 6;
}

message MarkCheckedRequest {}

message MarkCheckedResponse {
  int64 checked_at_ms = 1;
}
