syntax = "proto3";

package harold;

service Harold {
  rpc TurnComplete (TurnCompleteRequest) returns (TurnCompleteResponse);
  rpc ReportAgentState (ReportAgentStateRequest) returns (ReportAgentStateResponse);
  rpc WatchAgentStates (WatchAgentStatesRequest) returns (stream AgentStateSnapshot);
  rpc SetTtsMuted (SetTtsMutedRequest) returns (SetTtsMutedResponse);
  rpc SetMessagingPaused (SetMessagingPausedRequest) returns (SetMessagingPausedResponse);
  // An agent asks Harold to send text to the user's away device.
  rpc SendMessageToAwayDevice (SendMessageToAwayDeviceRequest) returns (SendMessageToAwayDeviceResponse);
  // The chief asks Harold to say a line at the desk, or to send it to the phone as text when away.
  rpc SpeakLine (SpeakLineRequest) returns (SpeakLineResponse);
  // The control-tower starts, ends and watches a call with the chief.
  rpc Call (CallRequest) returns (CallResponse);
  // Read-only. Returns the Harold state that `harold get` prints.
  rpc GetHaroldState (GetHaroldStateRequest) returns (GetHaroldStateResponse);
  // Read-only. Returns the remote order: the products in the order the control-tower
  // shows their remote sections.
  rpc GetRemoteOrder (GetRemoteOrderRequest) returns (GetRemoteOrderResponse);
  // Replaces the remote order with the products in the request.
  rpc SetRemoteOrder (SetRemoteOrderRequest) returns (SetRemoteOrderResponse);
}

// The web app's paired devices and its pairing lock, for `harold app`.
service HaroldApp {
  // Whether pairing is set up and locked, and the wrong tries so far. Never returns the code.
  // There is no unlock call: another program on the Mac could use it to reset the lock and
  // guess without limit, so `harold app pair --unlock` removes the lock file itself.
  rpc PairingStatus (PairingStatusRequest) returns (PairingStatusResponse);
  rpc ListDevices (ListDevicesRequest) returns (ListDevicesResponse);
  rpc UnpairDevice (UnpairDeviceRequest) returns (UnpairDeviceResponse);
}

message PairingStatusRequest {
  reserved 1;
}

message PairingStatusResponse {
  bool set_up = 1;
  // When not set up: missing, no_code, too_short or mode.
  string reason = 2;
  bool locked = 3;
  uint32 tries = 4;
}

message ListDevicesRequest {}

message PairedDevice {
  string name = 1;
  int64 paired_at_ms = 2;
  int64 last_seen_ms = 3;
}

message ListDevicesResponse {
  repeated PairedDevice devices = 1;
}

message UnpairDeviceRequest {
  string name = 1;
}

message UnpairDeviceResponse {}

message TurnCompleteRequest {
  string pane_id = 1;
  string pane_label = 2;
  string last_user_prompt = 3;
  string assistant_message = 4;
  string main_context = 5;
  // The agent's own session id, when the hook has one.
  string session_id = 6;
  // When the turn's prompt was written, RFC 3339, from the transcript line.
  string turn_started_at = 7;
  // The agent's transcript file, when the hook has one; empty otherwise.
  string transcript_path = 8;
}

message TurnCompleteResponse {
  bool accepted = 1;
}

enum AgentState {
  option allow_alias = true;
  AGENT_STATE_UNSPECIFIED = 0;
  AGENT_STATE_WORKING = 1;
  // The old name stays as an alias. An installed opencode plugin sends it through grpcurl.
  // grpcurl reads the name from this file and sends number 1.
  AGENT_STATE_BUSY = 1;
  AGENT_STATE_IDLE = 2;
  AGENT_STATE_UNKNOWN = 3;
  // The agent waits for an answer inside its turn.
  AGENT_STATE_BLOCKED = 4;
  // The agent finished a turn. It stays done until the next state arrives.
  AGENT_STATE_DONE = 5;
  // The last turn of the agent ended with an error.
  AGENT_STATE_ERROR = 6;
}

enum MonitorHealthState {
  MONITOR_HEALTH_STATE_UNSPECIFIED = 0;
  MONITOR_HEALTH_STATE_HEALTHY = 1;
  MONITOR_HEALTH_STATE_DEGRADED = 2;
}

message ReportAgentStateRequest {
  string pane_id = 1;
  AgentState state = 2;
  string adapter_id = 3;
  optional string work_summary = 4;
}

message ReportAgentStateResponse {
  bool accepted = 1;
}

message WatchAgentStatesRequest {}

message AgentPaneState {
  // The pane id. It has one of three forms: "%<n>" (tmux, this Mac), "block:<id>" (Rex,
  // this Mac) or "rex:<label>/block:<id>" (a block on another Rex host, read only).
  string pane_id = 1;
  // The pane label, <session>:<window>.<pane>, for tmux and Rex. A row of a Rex host
  // holds the session name only.
  string tmux_target = 2;
  string session_name = 3;
  uint32 window_index = 4;
  uint32 pane_index = 5;
  // The pane-root process id. A row for an agent on a Rex host carries the agent pid on that host.
  uint32 pane_pid = 6;
  uint32 agent_pid = 7;
  int64 agent_started_at_ms = 8;
  string provider_id = 9;
  string provider_display_name = 10;
  string working_directory = 11;
  AgentState state = 12;
  int64 last_transition_at_ms = 13;
  optional string work_summary = 14;
  // The latest recap of the agent's session; in memory only.
  optional string recap = 15;
  int64 recap_at_ms = 16;
  // The current step of a Rex agent, from its status record. It is in memory only.
  optional string current_step = 17;
  // The Rex host label, empty for this Mac.
  string host = 18;
  // The host's mark name: a Rex icon name, or arch, linux or mac. Empty for this Mac
  // and for a host with no icon.
  string host_icon = 19;
  // The name of the window that holds the pane; empty when the window has no name.
  string window_name = 20;
  // The role of the agent in its pod, for example a PnEM or a builder. Empty when the
  // pane has no role.
  string role = 21;
  // The product that the pod of the pane works on. Empty when the pane has no pod.
  string pod_product = 22;
}

// The request has no fields.
message GetRemoteOrderRequest {}

message GetRemoteOrderResponse {
  // The product names in remote order, first to last.
  repeated string products = 1;
}

message SetRemoteOrderRequest {
  // The product names in the new remote order, first to last.
  repeated string products = 1;
}

// The response has no fields.
message SetRemoteOrderResponse {}

message AgentMonitorHealth {
  string component = 1;
  MonitorHealthState state = 2;
  string reason_code = 3;
  int64 observed_at_ms = 4;
}

message AgentStateSnapshot {
  uint64 through_event_version = 1;
  int64 server_time_ms = 2;
  repeated AgentMonitorHealth monitor_health = 3;
  repeated AgentPaneState panes = 4;
  bool tts_muted = 5;
  bool messaging_paused = 6;
  string harold_version = 7;
}

message SetTtsMutedRequest {
  bool muted = 1;
}

message SetTtsMutedResponse {
  bool muted = 1;
}

message SetMessagingPausedRequest {
  bool paused = 1;
}

message SetMessagingPausedResponse {
  bool paused = 1;
}

message SendMessageToAwayDeviceRequest {
  // The pane id of the sending agent, such as "%47" (tmux) or "block:<id>" (Rex). Only the local forms are valid.
  string src_id = 1;
  string text = 2;
}

message SendMessageToAwayDeviceResponse {
  bool accepted = 1;
}

message SpeakLineRequest {
  // The pane id of the sending agent, such as "%47" (tmux) or "block:<id>" (Rex). Only the local forms are valid.
  string src_id = 1;
  string text = 2;
}

message SpeakLineResponse {}

enum CallAction {
  CALL_ACTION_UNSPECIFIED = 0;
  CALL_ACTION_START = 1;
  CALL_ACTION_STOP = 2;
  CALL_ACTION_TALK_NOW = 3;
  CALL_ACTION_STATUS = 4;
}

enum CallState {
  CALL_STATE_UNSPECIFIED = 0;
  CALL_STATE_OFF = 1;
  CALL_STATE_LISTENING = 2;
  CALL_STATE_TRANSCRIBING = 3;
  CALL_STATE_WAITING = 4;
  CALL_STATE_SPEAKING = 5;
  CALL_STATE_NOT_SET_UP = 6;
}

// UNSPECIFIED: no turn has ended in this call yet.
enum CallResult {
  CALL_RESULT_UNSPECIFIED = 0;
  CALL_RESULT_TYPED = 1;
  CALL_RESULT_NOTHING_HEARD = 2;
  CALL_RESULT_NO_CHIEF = 3;
  CALL_RESULT_CHIEF_BUSY = 4;
  CALL_RESULT_FAILED = 5;
  CALL_RESULT_VOICE_MUTED = 6;
}

message CallRequest {
  CallAction action = 1;
}

// chief_pane_id is empty when no chief runs; last_transcript is empty when there is none.
message CallResponse {
  CallState state = 1;
  string chief_pane_id = 2;
  string last_transcript = 3;
  CallResult last_result = 4;
}

message GetHaroldStateRequest {}

// This message never holds a secret or a path.
// The two flags are optional so that a false value is still written on the wire.
message GetHaroldStateResponse {
  optional bool tts_muted = 1;
  optional bool messaging_paused = 2;
  string release_version = 3;
  string machine_name = 4;
  string multiplexer = 5;
  repeated RexHostIcon rex_hosts = 6;
  string machine_host_icon = 7;
  string tts_engine = 8;
  string chief_session = 9;
}

message RexHostIcon {
  string label = 1;
  string host_icon = 2;
}
